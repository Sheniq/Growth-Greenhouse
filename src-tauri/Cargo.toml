[package]
name = "growth-greenhouse"
version = "0.1.2"
description = "A local-first learning greenhouse for Windows"
authors = ["Growth Greenhouse"]
license = "MIT"
edition = "2021"

[lib]
name = "growth_greenhouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
